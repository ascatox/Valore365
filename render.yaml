services:
  - type: web
    name: valore365-api
    runtime: python
    region: frankfurt
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # APP_ENV=prod also turns off /docs, /redoc and /openapi.json
      # (API_DOCS_ENABLED unset) and X-Ray justETF auto-enrichment
      # (JUSTETF_XRAY_AUTO_ENRICH_ENABLED unset). Requirements need Python
      # 3.11-3.13 (see src/backend/README.md), pinned below so the service
      # does not depend on Render's default.
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"
      - key: REQUEST_THREADPOOL_SIZE
        value: "24"
      - key: FINANCE_PROVIDER
        value: yfinance
      - key: FINANCE_API_BASE_URL
        value: ""
      - key: FINANCE_API_KEY
        value: ""
      - key: FINANCE_REQUEST_TIMEOUT_SECONDS
        value: "10"
      - key: FINANCE_MAX_RETRIES
        value: "3"
      - key: FINANCE_RETRY_BACKOFF_SECONDS
        value: "0.5"
      - key: FINANCE_SYMBOL_REQUEST_DELAY_SECONDS
        value: "0"
      - key: PRICE_SCHEDULER_ENABLED
        value: "true"
      - key: PRICE_SCHEDULER_INTERVAL_SECONDS
        value: "60"
      # TASK-53: daily closes (price_bars_1d) of every held asset, mon-fri.
      # Unset = follows PRICE_SCHEDULER_ENABLED. Defaults of the other knobs:
      # DAILY_BARS_SCHEDULER_HOUR=22, DAILY_BARS_SCHEDULER_MINUTE=30 (UTC),
      # DAILY_BARS_LOOKBACK_DAYS=10, PRICE_STALE_MAX_SESSIONS=2,
      # PRICE_UNCHANGED_TS_WARN_AFTER=3.
      - key: DAILY_BARS_SCHEDULER_ENABLED
        value: "true"
      # TASK-54: token Bearer degli endpoint interni /api/internal/market-data/sync
      # chiamati da GitHub Actions (.github/workflows/market-data-sync.yml).
      # Impostato nel dashboard (vuoto = endpoint disattivati, 404); stesso valore
      # del secret MARKET_DATA_SYNC_TOKEN del repository. Docs: docs/market-data-sync.md.
      # Default degli altri parametri: MARKET_DATA_SYNC_ON_STARTUP=true,
      # MARKET_DATA_SYNC_MAX_LOOKBACK_DAYS=30, MARKET_DATA_SYNC_GRACE_MINUTES=60.
      - key: MARKET_DATA_SYNC_TOKEN
        sync: false
      - key: CLERK_AUTH_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://valore365.vercel.app"
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: CLERK_JWKS_URL
        value: "https://ruling-coral-6.clerk.accounts.dev/.well-known/jwks.json"
      - key: CLERK_AUTHORIZED_PARTIES
        value: "https://valore365.vercel.app,https://*.vercel.app"
      # Remote MCP server, read-only (docs/mcp.md). Fails closed: served only
      # with CLERK_AUTH_ENABLED=true and MCP_RESOURCE_URL / CLERK_ISSUER set.
      # Set in the Render dashboard (unset = disabled), so a blueprint sync
      # does not switch it back off.
      - key: MCP_ENABLED
        sync: false
      # Production value: https://valore365.onrender.com/mcp
      - key: MCP_RESOURCE_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      # Only for opaque OAuth access tokens (oat_...).
      - key: CLERK_SECRET_KEY
        sync: false
      - key: MCP_ALLOWED_CLIENT_IDS
        sync: false
      - key: MCP_REQUIRE_AUDIENCE
        sync: false
      # Gradual rollout / kill switch (Clerk user ids, comma separated):
      # allowed empty = every user; blocked -> 403.
      - key: MCP_ALLOWED_USER_IDS
        sync: false
      - key: MCP_BLOCKED_USER_IDS
        sync: false
      # Per-IP limit on failed auth: off on Render, because without
      # TRUSTED_PROXY_IPS every client looks like Render's proxy IP and one
      # attacker could lock everyone out. Re-enable once client IPs are reliable.
      - key: MCP_AUTH_FAILURE_LIMIT
        value: "0"
