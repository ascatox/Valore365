<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1514" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Valore365" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Valore365</title>
    <script>try{var s=localStorage.getItem('mantine-color-scheme-value');var c=(s==='light'||s==='dark')?s:(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-mantine-color-scheme',c);}catch(e){}</script>
    <!-- Phone colour theme before first paint: the script sets the attribute, the rules give the light
         page background (lightPageBg in src/colorTheme.ts; dark comes from dark[7], default from index.css). -->
    <style>
      html[data-v365-theme='ocean']:not([data-mantine-color-scheme='dark']) { --v365-page-bg: #f4f7fc; }
      html[data-v365-theme='amethyst']:not([data-mantine-color-scheme='dark']) { --v365-page-bg: #f6f6fb; }
      html[data-v365-theme='orchid']:not([data-mantine-color-scheme='dark']) { --v365-page-bg: #faf5f8; }
      html[data-v365-theme='bronze']:not([data-mantine-color-scheme='dark']) { --v365-page-bg: #f9f6f1; }
      html[data-v365-theme='graphite']:not([data-mantine-color-scheme='dark']) { --v365-page-bg: #f5f7fa; }
    </style>
    <script>try{var t=localStorage.getItem('valore365.settings.colorTheme');if(t&&window.matchMedia('(max-width: 48em)').matches)document.documentElement.setAttribute('data-v365-theme',t);}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
